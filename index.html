<!doctype html>
<html lang="hr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F5F0">
  <meta name="robots" content="noindex, nofollow">
  <title>P &amp; G · 06.02.2027</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Playwrite+HR:wght@100..400&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app stage-lang">

  <!-- 1 · Language choice -->
  <section id="landing" class="landing">
    <div class="landing-mark">
      <svg class="bow-mark" width="72" height="40" viewBox="0 0 72 40" aria-hidden="true"><path d="M36 20 C 26 6, 8 4, 9 16 C 10 26, 26 24, 36 20"/><path d="M36 20 C 46 6, 64 4, 63 16 C 62 26, 46 24, 36 20"/><path d="M36 20 C 32 28, 24 32, 22 39"/><path d="M36 20 C 40 28, 48 32, 50 39"/><ellipse cx="36" cy="20" rx="3.2" ry="2.6"/></svg>
      <div class="monogram">P &amp; G</div>
      <div class="numeric-date">06 · 02 · 2027</div>
    </div>
    <div class="lang-row">
      <button type="button" class="lang-btn" data-lang="hr" lang="hr" style="--btn-bg:#E4E9EC"><span class="lang-label">Hrvatski</span></button>
      <button type="button" class="lang-btn" data-lang="en" lang="en" style="--btn-bg:#D5E4D1"><span class="lang-label">English</span></button>
      <button type="button" class="lang-btn" data-lang="ko" lang="ko" style="--btn-bg:#EDE5D8"><span class="lang-label">한국어</span></button>
    </div>
  </section>

  <!-- 2 · Envelope -->
  <section id="scene" class="scene" hidden>
    <button type="button" id="envBtn" class="env-btn">
      <span class="env">
        <span class="env-layer env-inside"></span>
        <span class="env-layer env-card">
          <span class="env-card-eyebrow" data-t="eyebrow"></span>
          <span class="env-card-names" data-t="coupleShort"></span>
          <span class="env-card-date">06 · 02 · 2027</span>
        </span>
        <svg class="env-layer env-front" width="280" height="380" viewBox="0 0 280 380" aria-hidden="true"><path d="M0 0 L140 204 L280 0 L280 380 L0 380 Z" fill="#FFFFFF"/><path d="M0 380 L140 214 L280 380" fill="none" stroke="#EEEAE3" stroke-width="1"/></svg>
        <svg class="env-layer env-flap" width="280" height="206" viewBox="0 0 280 206" aria-hidden="true"><path d="M0 0 L280 0 L140 204 Z" fill="#FBFAF7" stroke="#E7E3DB" stroke-width="1" stroke-linejoin="round"/></svg>
        <svg class="env-layer env-ribbon" width="280" height="380" viewBox="0 0 280 380" aria-hidden="true">
          <defs>
            <path id="cordV" d="M150 -6 C 147 120, 140 260, 132 386"/>
            <path id="cordH" d="M-6 150 C 90 156, 190 166, 286 176"/>
            <path id="cordBow" d="M146 160 C 116 110, 41 105, 46 150 C 50 180, 101 175, 146 160 C 176 105, 256 110, 250 154 C 246 184, 194 176, 146 160"/>
            <path id="cordTailL" d="M146 160 C 136 200, 86 220, 98 270 C 108 310, 66 330, 76 365"/>
            <path id="cordTailR" d="M146 160 C 160 200, 206 230, 190 280 C 176 325, 224 340, 216 375"/>
          </defs>
          <g fill="none" stroke-linecap="round">
            <use href="#cordV" class="cord"/><use href="#cordV" class="cord-twist"/>
            <use href="#cordH" class="cord"/><use href="#cordH" class="cord-twist"/>
          </g>
          <g transform="translate(146 160)" class="organza">
            <path d="M0 0 C -12 34, -40 70, -58 118 L -40 121 C -26 76, -8 38, 0 0 Z"/>
            <path d="M0 0 C 16 38, 32 80, 50 126 L 67 119 C 46 78, 22 34, 0 0 Z"/>
            <path d="M0 0 C -26 -46, -98 -50, -94 -8 C -90 24, -36 18, 0 0 Z"/>
            <path d="M0 0 C 30 -50, 104 -44, 96 -2 C 90 28, 38 20, 0 0 Z"/>
            <path class="sheen" d="M-4 -2 C -34 -26, -66 -30, -84 -14"/>
            <path class="sheen" d="M4 -2 C 36 -30, 70 -28, 86 -10"/>
          </g>
          <g fill="none" stroke-linecap="round">
            <use href="#cordBow" class="cord thin"/><use href="#cordBow" class="cord-twist thin"/>
            <use href="#cordTailL" class="cord thin"/><use href="#cordTailL" class="cord-twist thin"/>
            <use href="#cordTailR" class="cord thin"/><use href="#cordTailR" class="cord-twist thin"/>
          </g>
          <path d="M146 160 C 150 176, 160 188, 170 196" fill="none" stroke="#9AA398" stroke-width="0.8"/>
          <g transform="translate(166 190) rotate(-14)">
            <rect x="0" y="0" width="104" height="60" rx="2" fill="#FFFFFF" stroke="#E2DED6" stroke-width="1"/>
            <circle cx="10" cy="10" r="2.6" fill="none" stroke="#C9C4BA" stroke-width="0.8"/>
            <text x="56" y="30" text-anchor="middle" class="tag-names" data-t="coupleShort"></text>
            <text x="56" y="45" text-anchor="middle" class="tag-date">06.02.2027</text>
          </g>
          <ellipse cx="146" cy="160" rx="9" ry="7" fill="rgba(236,241,232,0.95)" stroke="rgba(110,120,108,0.65)" stroke-width="0.9"/>
        </svg>
      </span>
    </button>
    <div class="env-hint">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11V5.5a1.5 1.5 0 0 1 3 0V10"/><path d="M12 9.5a1.5 1.5 0 0 1 3 0V11"/><path d="M15 10.5a1.5 1.5 0 0 1 3 0V15a6 6 0 0 1-6 6h-1a6 6 0 0 1-4.6-2.2L4 15.5a1.6 1.6 0 0 1 2.4-2.1L9 16"/></svg>
      <span data-t="hint"></span>
    </div>
  </section>

  <!-- 3 · Dinner details -->
  <section id="letter" class="letter" hidden>
    <div class="letter-top">
      <button type="button" id="backBtn" class="back-btn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
    </div>

    <main class="card">
      <header class="head">
        <svg class="bow-mark" width="72" height="40" viewBox="0 0 72 40" aria-hidden="true"><path d="M36 20 C 26 6, 8 4, 9 16 C 10 26, 26 24, 36 20"/><path d="M36 20 C 46 6, 64 4, 63 16 C 62 26, 46 24, 36 20"/><path d="M36 20 C 32 28, 24 32, 22 39"/><path d="M36 20 C 40 28, 48 32, 50 39"/><ellipse cx="36" cy="20" rx="3.2" ry="2.6"/></svg>
        <h1 class="eyebrow" data-t="eyebrow"></h1>
        <div class="couple">
          <div class="person"><div class="role" data-t="brideLabel"></div><div class="name" data-t="bride"></div></div>
          <div class="amp" aria-hidden="true">&amp;</div>
          <div class="person"><div class="role" data-t="groomLabel"></div><div class="name" data-t="groom"></div></div>
        </div>
        <p class="lead" data-t="intro"></p>
      </header>

      <section class="tiles">
        <div class="tile tile-date">
          <div class="tile-label" data-t="dateLabel"></div>
          <div class="tile-big" data-t="dateBig"></div>
          <div class="tile-line" data-t="dateLine"></div>
        </div>
        <div class="tile tile-time">
          <div class="tile-label" data-t="timeLabel"></div>
          <div class="tile-big" data-t="timeBig"></div>
          <div class="tile-line" data-t="timeLine"></div>
        </div>
      </section>

      <section class="venue">
        <h2 class="section-label" data-t="venueLabel"></h2>
        <div class="venue-name" data-t="venueName"></div>
        <div class="venue-address" data-t="venueAddress"></div>
        <div class="venue-note" data-t="venueNote"></div>
      </section>

      <section class="program">
        <h2 class="section-label" data-t="programTitle"></h2>
        <div id="programList" class="program-list"></div>
      </section>

      <section class="routes">
        <div class="routes-head">
          <h2 class="section-label" data-t="routesTitle"></h2>
        </div>

        <svg class="overview-map" viewBox="0 0 340 290" role="img">
          <path d="M96 44 C 150 58, 196 64, 240 68 S 304 78, 344 96" fill="none" stroke="#CFE0DC" stroke-width="7" stroke-linecap="round"/>
          <text x="262" y="100" class="map-river" data-t="map.drava"></text>
          <path d="M50 257 C 80 190, 150 150, 187 76" fill="none" stroke="#D48A99" stroke-width="3.5" stroke-linecap="round"/>
          <path d="M290 61 C 265 52, 240 42, 221 46 C 205 52, 196 62, 187 76" fill="none" stroke="#6F9B72" stroke-width="3.5" stroke-linecap="round"/>
          <rect x="103" y="160" width="26" height="16" rx="3" fill="#4E7355"/>
          <text x="116" y="171.5" text-anchor="middle" class="map-badge">A4</text>
          <circle cx="50" cy="257" r="5" fill="#FFFFFF" stroke="#2F332F" stroke-width="1.6"/>
          <text x="62" y="261" class="map-city" data-t="map.zagreb"></text>
          <circle cx="221" cy="46" r="4" fill="#FFFFFF" stroke="#2F332F" stroke-width="1.4"/>
          <text x="214" y="32" text-anchor="middle" class="map-town" data-t="map.cakovec"></text>
          <circle cx="290" cy="61" r="5" fill="#FFFFFF" stroke="#2F332F" stroke-width="1.6"/>
          <text x="292" y="45" text-anchor="middle" class="map-city" data-t="map.prelog"></text>
          <circle cx="187" cy="76" r="10" fill="#2F332F"/>
          <circle cx="187" cy="76" r="3.6" fill="#F6D5DA"/>
          <text x="202" y="95" class="map-dest" data-t="map.varazdin"></text>
          <text x="202" y="110" class="map-hotel" data-t="venueName"></text>
        </svg>

        <div id="routeList" class="route-list"></div>
      </section>

      <footer class="closing">
        <p class="lead" data-t="closing"></p>
        <div class="signature" data-t="coupleShort"></div>
      </footer>
    </main>
  </section>

</div>

<template id="programTpl">
  <div class="program-item">
    <div><span class="chip"></span></div>
    <div class="program-body">
      <div class="program-title"></div>
    </div>
  </div>
</template>

<template id="routeTpl">
  <article class="route">
    <div class="route-head">
      <span class="route-swatch"></span>
      <h3 class="route-title"></h3>
      <div class="route-meta"></div>
    </div>
    <ol class="route-steps"></ol>
    <div class="route-map">
      <iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe>
    </div>
    <a class="map-btn" target="_blank" rel="noopener">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
      <span class="map-btn-label"></span>
    </a>
  </article>
</template>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
